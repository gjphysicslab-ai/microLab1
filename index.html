<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초음파 거리 측정 실험 · 데이터 수집</title>
<style>
  /* ── 토큰 시스템 ───────────────────────────────── */
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --panel:     #1c2330;
    --border:    #30363d;
    --accent:    #58a6ff;
    --accent2:   #3fb950;
    --warn:      #f78166;
    --text:      #e6edf3;
    --text-dim:  #8b949e;
    --font-mono: 'JetBrains Mono', 'Fira Mono', 'Consolas', monospace;
    --font-ui:   'Inter', 'Noto Sans KR', system-ui, sans-serif;
    --radius:    6px;
    --transition: 0.15s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    padding: 24px 20px 48px;
  }

  /* ── 헤더 ──────────────────────────────────────── */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .header-text h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .header-text p {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background var(--transition);
  }
  .badge.connected .dot { background: var(--accent2); }
  .badge.running   .dot { background: var(--accent); animation: pulse 1s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  /* ── 컨트롤 바 ─────────────────────────────────── */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: var(--font-ui);
    font-weight: 500;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background var(--transition), border-color var(--transition), opacity var(--transition);
    background: var(--panel);
    color: var(--text);
  }
  button:disabled { opacity: 0.38; cursor: not-allowed; }

  #btn-connect  { border-color: var(--accent);  color: var(--accent); }
  #btn-connect:hover:not(:disabled)  { background: rgba(88,166,255,0.12); }

  #btn-start    { border-color: var(--accent2); color: var(--accent2); }
  #btn-start:hover:not(:disabled)   { background: rgba(63,185,80,0.12); }

  #btn-stop     { border-color: var(--warn);    color: var(--warn); }
  #btn-stop:hover:not(:disabled)    { background: rgba(247,129,102,0.12); }

  #btn-clear    { border-color: var(--border); }
  #btn-clear:hover:not(:disabled)   { background: var(--border); }

  #btn-csv      { border-color: var(--accent2); color: var(--accent2); }
  #btn-csv:hover:not(:disabled)     { background: rgba(63,185,80,0.12); }

  /* ── 대시보드 그리드 ────────────────────────────── */
  .dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  @media (max-width: 640px) {
    .dashboard { grid-template-columns: 1fr 1fr; }
  }

  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .metric-card .label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: none;
    letter-spacing: 0.2px;
    margin-bottom: 8px;
  }
  .metric-card .value {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .metric-card .unit {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-dim);
    margin-left: 4px;
  }
  #card-dist  .value { color: var(--accent); }
  #card-speed .value { color: var(--accent2); }
  #card-accel .value { color: #d2a8ff; }

  /* ── 로그 & 테이블 영역 ─────────────────────────── */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .section-head h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }
  .row-count {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-dim);
  }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: auto;
    max-height: 420px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    font-family: var(--font-mono);
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    color: var(--text-dim);
    font-weight: 500;
    font-family: var(--font-ui);
    font-size: 11px;
    padding: 9px 14px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  thead th:first-child { text-align: left; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,0.025); }
  tbody td {
    padding: 7px 14px;
    text-align: right;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    color: var(--text);
  }
  tbody td:first-child { text-align: left; color: var(--text-dim); }
  tbody td.err         { color: var(--warn); }

  /* ── 그래프 영역 ────────────────────────────────── */
  .charts-section { margin-bottom: 28px; }
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px 10px;
  }
  .chart-card .chart-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }
  .chart-card canvas { display: block; width: 100% !important; }

  /* ── 상태 메시지 ────────────────────────────────── */
  #status-bar {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 14px;
    font-family: var(--font-mono);
    min-height: 18px;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<header>
  <div class="header-text">
    <h1>초음파 거리 측정 실험 — 데이터 수집 시스템</h1>
    <p>HC-SR04 · micro:bit · Web Serial · 0.5 s 자동 수집</p>
  </div>
  <span class="badge" id="conn-badge">
    <span class="dot"></span>
    <span id="conn-label">연결 안됨</span>
  </span>
</header>

<!-- 컨트롤 -->
<div class="controls">
  <button id="btn-connect">⚡ 포트 연결</button>
  <button id="btn-start"   disabled>▶ 측정 시작</button>
  <button id="btn-stop"    disabled>■ 측정 중지</button>
  <button id="btn-clear"   disabled>🗑 데이터 초기화</button>
  <button id="btn-csv"     disabled>⬇ CSV 다운로드</button>
</div>

<!-- 실시간 수치 -->
<div class="dashboard">
  <div class="metric-card" id="card-dist">
    <div class="label">현재 거리</div>
    <div class="value" id="disp-dist">—<span class="unit">cm</span></div>
  </div>
  <div class="metric-card" id="card-speed">
    <div class="label">속도 (Δd/Δt)</div>
    <div class="value" id="disp-speed">—<span class="unit">cm/s</span></div>
  </div>
  <div class="metric-card" id="card-accel">
    <div class="label">가속도 (Δv/Δt)</div>
    <div class="value" id="disp-accel">—<span class="unit">cm/s²</span></div>
  </div>
</div>

<!-- 실시간 그래프 -->
<div class="charts-section">
  <div class="section-head" style="margin-bottom:10px">
    <h2>실시간 그래프</h2>
  </div>
  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title">거리 — 시간 (cm vs s)</div>
      <canvas id="chart-dist" height="140"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">속도 — 시간 (cm/s vs s)</div>
      <canvas id="chart-speed" height="140"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">가속도 — 시간 (cm/s² vs s)</div>
      <canvas id="chart-accel" height="140"></canvas>
    </div>
  </div>
</div>

<!-- 데이터 테이블 -->
<div class="section-head">
  <h2>측정 데이터 기록</h2>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="scroll-lock-badge" style="display:none;font-size:11px;font-family:var(--font-mono);color:var(--warn);background:rgba(247,129,102,0.12);border:1px solid rgba(247,129,102,0.3);border-radius:12px;padding:2px 9px">⏸ 스크롤 일시정지</span>
    <span class="row-count" id="row-count">0 개</span>
  </div>
</div>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>경과 시간 (s)</th>
        <th>거리 (cm)</th>
        <th>속도 (cm/s)</th>
        <th>가속도 (cm/s²)</th>
      </tr>
    </thead>
    <tbody id="data-body"></tbody>
  </table>
</div>

<div style="position:relative">
  <button id="scroll-btn" onclick="jumpToBottom()" style="display:none;position:absolute;bottom:12px;right:12px;z-index:10;padding:6px 14px;font-size:12px;background:var(--accent);color:#fff;border:none;border-radius:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.4)">↓ 최신 데이터로</button>
</div>
<div id="status-bar">포트를 연결하고 측정을 시작하세요.</div>

<script>
// ── 상태 ───────────────────────────────────────────
let port = null, reader = null, isRunning = false
let startTime = null
let rows = []          // { t, d, v, a }
let buffer = ''

// ── Chart.js 공통 옵션 ──────────────────────────────
const MAX_POINTS = 120   // 최대 표시 포인트 (60초 분량)

function makeChartCfg(label, color, yLabel) {
  return {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label,
        data: [],
        borderColor: color,
        backgroundColor: color + '22',
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 4,
        tension: 0.3,
        fill: true,
        spanGaps: false
      }]
    },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c2330',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#8b949e',
          bodyColor: '#e6edf3',
          titleFont: { family: 'Consolas, monospace', size: 11 },
          bodyFont:  { family: 'Consolas, monospace', size: 12 },
          callbacks: {
            title: items => `t = ${items[0].label} s`,
            label: item  => `${item.dataset.label}: ${item.parsed.y ?? '—'}`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#8b949e', font: { size: 10, family: 'Consolas,monospace' }, maxTicksLimit: 10 },
          grid:  { color: '#30363d' },
          title: { display: true, text: '시간 (s)', color: '#8b949e', font: { size: 11 } }
        },
        y: {
          ticks: { color: '#8b949e', font: { size: 10, family: 'Consolas,monospace' } },
          grid:  { color: '#30363d' },
          title: { display: true, text: yLabel, color: '#8b949e', font: { size: 11 } }
        }
      }
    }
  }
}

// 차트 인스턴스 생성
const chartDist  = new Chart(document.getElementById('chart-dist'),
  makeChartCfg('거리 (cm)',    '#58a6ff', '거리 (cm)'))
const chartSpeed = new Chart(document.getElementById('chart-speed'),
  makeChartCfg('속도 (cm/s)', '#3fb950', '속도 (cm/s)'))
const chartAccel = new Chart(document.getElementById('chart-accel'),
  makeChartCfg('가속도 (cm/s²)', '#d2a8ff', '가속도 (cm/s²)'))

// ── 그래프에 포인트 추가 ────────────────────────────
function pushToCharts(t, d, v, a) {
  const tLabel = t.toFixed(2)

  function pushOne(chart, val) {
    const ds = chart.data.datasets[0]
    chart.data.labels.push(tLabel)
    ds.data.push(val !== null ? val : null)
    if (chart.data.labels.length > MAX_POINTS) {
      chart.data.labels.shift()
      ds.data.shift()
    }
    chart.update('none')
  }

  pushOne(chartDist,  d)
  pushOne(chartSpeed, v)
  pushOne(chartAccel, a)
}

// ── 그래프 초기화 ───────────────────────────────────
function clearCharts() {
  ;[chartDist, chartSpeed, chartAccel].forEach(c => {
    c.data.labels = []
    c.data.datasets[0].data = []
    c.update('none')
  })
}

// ── DOM 참조 ────────────────────────────────────────
const btnConnect = document.getElementById('btn-connect')
const btnStart   = document.getElementById('btn-start')
const btnStop    = document.getElementById('btn-stop')
const btnClear   = document.getElementById('btn-clear')
const btnCsv     = document.getElementById('btn-csv')
const connBadge  = document.getElementById('conn-badge')
const connLabel  = document.getElementById('conn-label')
const dispDist   = document.getElementById('disp-dist')
const dispSpeed  = document.getElementById('disp-speed')
const dispAccel  = document.getElementById('disp-accel')
const dataBody   = document.getElementById('data-body')
const rowCount   = document.getElementById('row-count')
const statusBar  = document.getElementById('status-bar')
const scrollBtn  = document.getElementById('scroll-btn')
const scrollLockBadge = document.getElementById('scroll-lock-badge')

function jumpToBottom() {
  autoScroll = true
  tableWrap.scrollTop = tableWrap.scrollHeight
  scrollBtn.style.display = 'none'
  scrollLockBadge.style.display = 'none'
}

// ── Web Serial 연결 ─────────────────────────────────
btnConnect.addEventListener('click', async () => {
  if (!('serial' in navigator)) {
    setStatus('⚠ 이 브라우저는 Web Serial을 지원하지 않습니다. Chrome 89+ 를 사용하세요.', true)
    return
  }
  try {
    port = await navigator.serial.requestPort()
    await port.open({ baudRate: 115200 })
    setConnected(true)
    setStatus('마이크로비트 연결 완료. 측정 시작 버튼을 누르세요.')
    readLoop()
  } catch (e) {
    setStatus('연결 실패: ' + e.message, true)
  }
})

// ── 데이터 수신 루프 ────────────────────────────────
async function readLoop() {
  const decoder = new TextDecoderStream()
  port.readable.pipeTo(decoder.writable)
  reader = decoder.readable.getReader()
  try {
    while (true) {
      const { value, done } = await reader.read()
      if (done) break
      buffer += value
      let lines = buffer.split('\n')
      buffer = lines.pop()
      for (const line of lines) parseLine(line.trim())
    }
  } catch (e) {
    if (isRunning) setStatus('연결이 끊어졌습니다: ' + e.message, true)
  }
}

// ── 수신 라인 파싱 ──────────────────────────────────
function parseLine(line) {
  if (!line || !isRunning) return
  if (!line.startsWith('SENSOR:')) return

  const raw = parseFloat(line.split(':')[1])
  const now  = performance.now()

  if (startTime === null) startTime = now
  const t = +((now - startTime) / 1000).toFixed(2)

  // 유효 범위: 2–400 cm (SR04 스펙)
  if (raw < 2 || raw > 400) {
    appendRow(t, null, null, null)
    updateDisplay(null, null, null)
    pushToCharts(t, null, null, null)
    return
  }

  const d = +raw.toFixed(1)
  let v = null, a = null

  // ── 노이즈 임계값 ──────────────────────────────────
  // SR04 센서 노이즈 ±0.3cm → 이 이하의 거리 변화는 정지로 간주
  const DIST_THRESHOLD = 0.5   // cm: 이 미만 변화는 0으로 처리
  const VEL_THRESHOLD  = 0.5   // cm/s: 이 미만 속도는 0으로 처리

  const n = rows.filter(r => r.d !== null).length
  if (n >= 1) {
    const prev = rows.slice().reverse().find(r => r.d !== null)
    const dt = t - prev.t
    if (dt > 0) {
      const dd = d - prev.d
      // 거리 변화가 임계값 미만이면 속도 = 0
      const rawV = Math.abs(dd) < DIST_THRESHOLD ? 0 : dd / dt
      v = +rawV.toFixed(2)

      if (n >= 2 && prev.v !== null) {
        const dv = v - prev.v
        // 속도 변화가 임계값 미만이면 가속도 = 0
        const rawA = Math.abs(dv) < VEL_THRESHOLD ? 0 : dv / dt
        a = +rawA.toFixed(2)
      }
    }
  }

  rows.push({ t, d, v, a })
  appendRow(t, d, v, a)
  updateDisplay(d, v, a)
  pushToCharts(t, d, v, a)
}

// ── 자동 스크롤 상태 ────────────────────────────────
let autoScroll = true
const tableWrap = document.querySelector('.table-wrap')

// 사용자가 위로 스크롤하면 자동 스크롤 잠금
tableWrap.addEventListener('scroll', () => {
  const distFromBottom = tableWrap.scrollHeight - tableWrap.scrollTop - tableWrap.clientHeight
  autoScroll = distFromBottom < 8   // 맨 아래 8px 이내면 자동 스크롤 재개
  scrollBtn.style.display        = autoScroll ? 'none'  : 'block'
  scrollLockBadge.style.display  = autoScroll ? 'none'  : 'inline-flex'
})

// ── 테이블에 행 추가 ────────────────────────────────
function appendRow(t, d, v, a) {
  const idx = rows.length
  const tr = document.createElement('tr')
  tr.innerHTML = `
    <td>${idx}</td>
    <td>${t.toFixed(2)}</td>
    <td class="${d === null ? 'err' : ''}">${d !== null ? d.toFixed(1) : '범위초과'}</td>
    <td>${v !== null ? v.toFixed(2) : '—'}</td>
    <td>${a !== null ? a.toFixed(2) : '—'}</td>
  `
  dataBody.appendChild(tr)
  if (autoScroll) {
    tableWrap.scrollTop = tableWrap.scrollHeight
  }
  rowCount.textContent = `${idx} 개`
  btnCsv.disabled = false
}

// ── 대시보드 수치 갱신 ──────────────────────────────
function updateDisplay(d, v, a) {
  dispDist.innerHTML  = d !== null ? `${d.toFixed(1)}<span class="unit">cm</span>`    : `<span style="color:var(--warn)">오류</span>`
  dispSpeed.innerHTML = v !== null ? `${v.toFixed(2)}<span class="unit">cm/s</span>`  : `—<span class="unit">cm/s</span>`
  dispAccel.innerHTML = a !== null ? `${a.toFixed(2)}<span class="unit">cm/s²</span>` : `—<span class="unit">cm/s²</span>`
}

// ── 측정 시작/중지 ──────────────────────────────────
btnStart.addEventListener('click', () => {
  isRunning  = true
  startTime  = null
  setStatus('측정 중... (마이크로비트 A 버튼도 눌러주세요)')
  connBadge.className = 'badge running'
  connLabel.textContent = '측정 중'
  btnStart.disabled = true
  btnStop.disabled  = false
})

btnStop.addEventListener('click', () => {
  isRunning = false
  connBadge.className = 'badge connected'
  connLabel.textContent = '연결됨'
  btnStart.disabled = false
  btnStop.disabled  = true
  setStatus(`측정 중지. 총 ${rows.length}개 데이터 수집됨.`)
})

// ── 데이터 초기화 ───────────────────────────────────
btnClear.addEventListener('click', () => {
  rows = []
  startTime = null
  autoScroll = true
  dataBody.innerHTML = ''
  rowCount.textContent = '0 개'
  btnCsv.disabled = true
  scrollBtn.style.display = 'none'
  scrollLockBadge.style.display = 'none'
  dispDist.innerHTML  = '—<span class="unit">cm</span>'
  dispSpeed.innerHTML = '—<span class="unit">cm/s</span>'
  dispAccel.innerHTML = '—<span class="unit">cm/s²</span>'
  clearCharts()
  setStatus('데이터가 초기화되었습니다.')
})

// ── CSV 다운로드 ─────────────────────────────────────
btnCsv.addEventListener('click', () => {
  const now = new Date()
  const ts  = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`
  let csv = '번호,경과시간(s),거리(cm),속도(cm/s),가속도(cm/s²)\n'
  rows.forEach((r, i) => {
    csv += `${i+1},${r.t.toFixed(2)},${r.d !== null ? r.d.toFixed(1) : ''},${r.v !== null ? r.v.toFixed(2) : ''},${r.a !== null ? r.a.toFixed(2) : ''}\n`
  })
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' })
  const url  = URL.createObjectURL(blob)
  const a    = document.createElement('a')
  a.href = url; a.download = `distance_${ts}.csv`
  a.click(); URL.revokeObjectURL(url)
  setStatus(`CSV 다운로드 완료: distance_${ts}.csv`)
})

// ── 헬퍼 ────────────────────────────────────────────
function setConnected(yes) {
  connBadge.className  = yes ? 'badge connected' : 'badge'
  connLabel.textContent = yes ? '연결됨' : '연결 안됨'
  btnConnect.disabled = yes
  btnStart.disabled   = !yes
  btnClear.disabled   = !yes
}

function setStatus(msg, warn = false) {
  statusBar.textContent = msg
  statusBar.style.color = warn ? 'var(--warn)' : 'var(--text-dim)'
}
</script>
</body>
</html>
